<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Churn Predictor</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f7f9; color: #1d2330; margin: 0; }
    main { max-width: 520px; margin: 48px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size: 1.4rem; margin: 0 0 20px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    label span { float: right; font-weight: 400; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; }
    .track { height: 28px; background: #e6e8ec; border-radius: 14px; overflow: hidden; margin-top: 28px; }
    .fill { height: 100%; width: 0; border-radius: 14px; transition: width .3s ease, background-color .3s ease; }
    .result { display: flex; justify-content: space-between; margin-top: 10px; font-variant-numeric: tabular-nums; }
    .result strong { font-size: 1.6rem; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Telco churn risk</h1>

      <label>Tenure (months) <span id="tenure-val"></span></label>
      <input id="tenure" type="range" min="0" max="72" value="12">

      <label>Monthly charges ($) <span id="monthly-val"></span></label>
      <input id="monthly" type="range" min="18" max="120" step="0.5" value="70.5">

      <label><input id="techsupport" type="checkbox"> Has tech support</label>

      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="result"><span id="label">Churn probability</span><strong id="prob">–</strong></div>
    </div>
  </main>

  <script>
    const tenure = document.getElementById("tenure");
    const monthly = document.getElementById("monthly");
    const techsupport = document.getElementById("techsupport");
    const fill = document.getElementById("fill");
    const prob = document.getElementById("prob");
    const label = document.getElementById("label");

    async function update() {
      document.getElementById("tenure-val").textContent = tenure.value;
      document.getElementById("monthly-val").textContent = Number(monthly.value).toFixed(2);

      const res = await fetch("predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          tenure: Number(tenure.value),
          monthly: Number(monthly.value),
          techsupport: techsupport.checked ? 1 : 0,
        }),
      });
      const p = (await res.json()).prediction;

      // Hue 120 (green) at 0% churn down to 0 (red) at 100%
      const color = `hsl(${120 * (1 - p)}, 70%, 45%)`;
      fill.style.width = `${p * 100}%`;
      fill.style.backgroundColor = color;
      prob.textContent = `${(p * 100).toFixed(1)}%`;
      prob.style.color = color;
      label.textContent = p < 0.33 ? "Low churn risk" : p < 0.66 ? "Medium churn risk" : "High churn risk";
    }

    [tenure, monthly, techsupport].forEach(el => el.addEventListener("input", update));
    update();
  </script>
</body>
</html>
