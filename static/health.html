<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Health</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f7f9; color: #1d2330; margin: 0; }
    main { max-width: 520px; margin: 48px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 32px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
    .dot { width: 72px; height: 72px; border-radius: 50%; background: hsl(120, 70%, 45%); margin: 0 auto 20px;
           animation: pulse 2s ease-out infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 hsla(120, 70%, 45%, .5); }
      100% { box-shadow: 0 0 0 24px hsla(120, 70%, 45%, 0); }
    }
    h1 { font-size: 1.6rem; margin: 0 0 8px; color: hsl(120, 70%, 30%); }
    p { margin: 4px 0; color: #5b6475; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="dot"></div>
      <h1>API is running</h1>
      <p>Status: <code>ok</code></p>
      <p><a href="./">Open the churn predictor</a></p>
    </div>
  </main>
</body>
</html>
