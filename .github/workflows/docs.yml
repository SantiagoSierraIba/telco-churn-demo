name: Documentation

# This defines the triggers for the workflow
on:
  push:
    branches: [ "main" ]

# The workflow publishes the built site to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site

    runs-on: ubuntu-latest

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Get repository
        uses: actions/checkout@v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.3

      # Only the dev group is installed. Zensical is in it.
      - name: Build the site
        run: uv run --only-dev zensical build --clean

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # The site is deployed in a second job, after the upload has finished
  deploy:
    name: Deploy site to GitHub Pages

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
